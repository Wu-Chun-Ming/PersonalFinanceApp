name: build

on:
  push:
    branches: [master, dev, ci]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run testFinal

  # -----------------------
  # Android Build Job
  # -----------------------
  android-build:
    runs-on: ubuntu-latest
    needs: node-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: echo "${{ secrets.MYAPP_UPLOAD_STORE_FILE_BASE64 }}" | base64 --decode > android/app/my-upload-key.keystore

      - name: Set up Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore" >> ~/.gradle/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}" >> ~/.gradle/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}" >> ~/.gradle/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}" >> ~/.gradle/gradle.properties

      - name: Build Debug APK
        working-directory: android
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          ./gradlew assembleDebug --build-cache --parallel --configure-on-demand --no-daemon $SKIP_TASKS

      - name: Build Release APK
        working-directory: android
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ci'
        run: |
          ./gradlew assembleRelease --build-cache --parallel --configure-on-demand --no-daemon

      - name: Upload Debug APK
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ci'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
